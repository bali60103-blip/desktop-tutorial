<meta charset="utf-8">
<title>市民大道南北分隔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#e9e6de; --surface:#f7f5f0; --surface-2:#efece5;
  --ink:#16181c; --ink-2:#575c64; --ink-3:#8a8e94;
  --rule:#d2ccbe; --rule-2:#bdb6a5;
  --accent:#cc4526; --accent-soft:#f2ded6;
  --north:#2f6f92; --north-soft:#dbe7ee;
  --south:#a8761f; --south-soft:#f0e6d2;
  --deck:#8b8f96; --good:#4a7c4e; --warn:#b8721c;
  --shadow:0 1px 1px rgba(20,22,26,.05),0 8px 24px -16px rgba(20,22,26,.28);
  --serif:"Noto Serif TC",serif;
  --sans:"Noto Sans TC",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0f1216; --surface:#171b21; --surface-2:#1d222a;
    --ink:#e7e9eb; --ink-2:#a3a9b2; --ink-3:#6d747e;
    --rule:#282e37; --rule-2:#39414d;
    --accent:#ff6a44; --accent-soft:#2e1a14;
    --north:#5ba7cc; --north-soft:#122430;
    --south:#d9a747; --south-soft:#2a2010;
    --deck:#767c85; --good:#7fb083; --warn:#d79a3f;
    --shadow:0 1px 1px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#0f1216; --surface:#171b21; --surface-2:#1d222a;
  --ink:#e7e9eb; --ink-2:#a3a9b2; --ink-3:#6d747e;
  --rule:#282e37; --rule-2:#39414d;
  --accent:#ff6a44; --accent-soft:#2e1a14;
  --north:#5ba7cc; --north-soft:#122430;
  --south:#d9a747; --south-soft:#2a2010;
  --deck:#767c85; --good:#7fb083; --warn:#d79a3f;
  --shadow:0 1px 1px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:14.5px;line-height:1.62;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0}
.tab{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.wrap{max-width:1500px;margin:0 auto;padding:0 22px 80px}
@media(max-width:700px){.wrap{padding:0 13px 56px}}

/* ---------- masthead: a title block from a drawing sheet ---------- */
header.sheet{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;
  align-items:end;padding:30px 0 16px;border-bottom:2px solid var(--ink)}
@media(max-width:860px){header.sheet{grid-template-columns:1fr;align-items:start;gap:16px}}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);margin-bottom:9px}
h1{font-size:clamp(25px,3.4vw,40px);font-weight:900;line-height:1.14;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--accent)}
.lede{color:var(--ink-2);max-width:60ch;margin:11px 0 0;font-size:15px}
.stampbox{display:grid;grid-template-columns:repeat(2,auto);gap:1px;
  background:var(--rule);border:1px solid var(--rule);font-family:var(--mono);font-size:11px}
.stampbox div{background:var(--surface);padding:6px 11px;white-space:nowrap}
.stampbox b{display:block;color:var(--ink-3);font-weight:400;font-size:9.5px;
  letter-spacing:.08em;text-transform:uppercase}

/* ---------- verdict ribbon ---------- */
.ribbon{display:flex;flex-wrap:wrap;gap:0;margin:20px 0 0;border:1px solid var(--rule);
  background:var(--rule)}
.ribbon>div{flex:1 1 155px;background:var(--surface);padding:13px 15px;margin:0 1px 1px 0}
.ribbon .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:5px}
.ribbon .v{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1}
.ribbon .v small{font-family:var(--sans);font-size:11.5px;font-weight:400;color:var(--ink-3)}
.ribbon .n{font-size:11.5px;color:var(--ink-2);margin-top:4px;line-height:1.4}
.v.bad{color:var(--accent)} .v.ok{color:var(--good)}

/* ---------- section headers ---------- */
section{margin-top:46px}
.shead{display:flex;align-items:baseline;gap:12px;padding-bottom:7px;
  border-bottom:1px solid var(--ink);margin-bottom:16px;flex-wrap:wrap}
.shead .sn{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);
  letter-spacing:.1em}
.shead h2{font-size:19px;font-weight:700}
.shead .sd{font-size:12.5px;color:var(--ink-3);margin-left:auto;font-family:var(--mono)}

/* ---------- map ---------- */
.maprow{position:relative;border:1px solid var(--rule-2);background:var(--surface);
  box-shadow:var(--shadow)}
#map{display:block;width:100%;height:min(60vh,540px);cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}
.panel{position:absolute;top:11px;left:11px;width:212px;max-height:calc(100% - 22px);
  overflow-y:auto;background:var(--surface);border:1px solid var(--rule-2);
  padding:11px 12px;font-size:12.5px;box-shadow:var(--shadow)}
.panel.collapsed{width:auto;max-height:none;overflow:visible}
.panel.collapsed .pbody{display:none}
.ptitle{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.ptitle button{margin-left:auto;background:none;border:1px solid var(--rule-2);
  color:var(--ink-2);font-family:var(--mono);font-size:10px;padding:1px 6px;cursor:pointer}
.lgroup{margin-top:11px}
.lgroup>.gl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);padding-bottom:3px;border-bottom:1px solid var(--rule);margin-bottom:5px}
label.lyr{display:flex;align-items:center;gap:7px;padding:2.5px 0;cursor:pointer;line-height:1.35}
label.lyr input{margin:0;flex:none;accent-color:var(--accent)}
label.lyr .sw{width:13px;height:9px;flex:none;border:1px solid var(--rule-2)}
label.lyr span.t{flex:1;min-width:0}
label.lyr .eid{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);flex:none}
.legend{position:absolute;right:11px;bottom:11px;background:var(--surface);
  border:1px solid var(--rule-2);padding:9px 11px;font-size:11.5px;max-width:250px;
  box-shadow:var(--shadow)}
.legend .lt{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.legend .row{display:flex;align-items:center;gap:6px;line-height:1.5}
.legend .dot{width:10px;height:10px;border-radius:50%;flex:none}
.legend .bar{display:flex;height:9px;margin:3px 0 2px}
.legend .bar i{flex:1}
.legend .scale{display:flex;justify-content:space-between;font-family:var(--mono);
  font-size:9.5px;color:var(--ink-3)}
.zoomers{position:absolute;right:11px;top:11px;display:flex;flex-direction:column;gap:1px}
.zoomers button{width:28px;height:28px;background:var(--surface);border:1px solid var(--rule-2);
  color:var(--ink);font-family:var(--mono);font-size:15px;cursor:pointer;line-height:1}
.zoomers button:hover{background:var(--surface-2)}
.readout{position:absolute;left:11px;bottom:11px;background:var(--surface);
  border:1px solid var(--rule-2);padding:6px 10px;font-family:var(--mono);font-size:11px;
  color:var(--ink-2);pointer-events:none;max-width:min(420px,calc(100% - 290px))}
@media(max-width:820px){
  .panel{position:static;width:auto;max-height:260px;border:none;border-bottom:1px solid var(--rule-2)}
  .legend,.readout{position:static;border:none;border-top:1px solid var(--rule);max-width:none;box-shadow:none}
  #map{height:52vh}
}
/* chainage ruler under the map */
.ruler{position:relative;height:26px;border:1px solid var(--rule-2);border-top:none;
  background:var(--surface-2);font-family:var(--mono);font-size:9.5px;color:var(--ink-3);
  overflow:hidden}
.ruler i{position:absolute;top:0;width:1px;height:6px;background:var(--rule-2)}
.ruler b{position:absolute;top:7px;transform:translateX(-50%);font-weight:400;white-space:nowrap}
.ruler .zone{position:absolute;top:18px;height:5px;opacity:.8}

/* ---------- charts ---------- */
.chartcard{background:var(--surface);border:1px solid var(--rule);padding:15px 17px 12px}
.chartcard h3{font-size:14.5px;font-weight:700;margin-bottom:2px}
.chartcard .sub{font-size:12px;color:var(--ink-2);margin-bottom:10px;max-width:66ch}
.chartcard svg{display:block;width:100%;height:auto;overflow:visible}
.chartcard .note{font-size:11.5px;color:var(--ink-3);margin-top:8px;line-height:1.5}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media(max-width:960px){.grid2{grid-template-columns:1fr}}
.strips{display:grid;gap:9px}
.striprow{display:grid;grid-template-columns:112px minmax(0,1fr);gap:11px;align-items:center}
@media(max-width:700px){.striprow{grid-template-columns:1fr;gap:3px}}
.striprow .sl{font-size:11.5px;line-height:1.35;text-align:right;color:var(--ink-2)}
.striprow .sl b{display:block;color:var(--ink);font-size:12px;font-weight:600}
@media(max-width:700px){.striprow .sl{text-align:left}}
.striprow svg{display:block;width:100%;height:auto;overflow:visible;
  background:var(--surface);border:1px solid var(--rule)}

/* ---------- evidence cards ---------- */
.ev{display:grid;gap:10px}
.evcard{display:grid;grid-template-columns:56px minmax(0,1fr);background:var(--surface);
  border:1px solid var(--rule);border-left:3px solid var(--rule-2)}
.evcard.sup{border-left-color:var(--accent)}
.evcard.con{border-left-color:var(--north)}
.evcard.neu{border-left-color:var(--rule-2)}
.evcard .tag{padding:13px 0 13px 12px;font-family:var(--mono);font-size:12px;font-weight:600}
.evcard .tag .vd{display:block;font-size:9.5px;letter-spacing:.06em;margin-top:4px;
  font-weight:400;color:var(--ink-3);text-transform:uppercase}
.evcard.sup .tag{color:var(--accent)} .evcard.con .tag{color:var(--north)}
.evcard .body{padding:13px 15px 13px 4px;min-width:0}
.evcard h3{font-size:14.5px;font-weight:700;margin-bottom:6px}
.kv{display:grid;grid-template-columns:52px minmax(0,1fr);gap:2px 9px;font-size:12.5px;
  margin-bottom:8px}
.kv dt{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);padding-top:3px}
.kv dd{margin:0;font-family:var(--mono);font-size:12px;color:var(--ink)}
.kv dd.cmp{color:var(--ink-2);font-size:11.5px}
.evcard .why{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.evcard .why b{color:var(--ink);font-weight:600}

/* ---------- tables & caveats ---------- */
.tw{overflow-x:auto;border:1px solid var(--rule);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);padding:9px 12px;
  border-bottom:1px solid var(--rule-2);white-space:nowrap;background:var(--surface-2)}
td{padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:none}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hi td{background:var(--accent-soft)}
.cav{border:1px dashed var(--rule-2);background:var(--surface);padding:13px 16px;font-size:12.5px;
  color:var(--ink-2)}
.cav .ck{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);margin-bottom:6px}
.cav ul{margin:0;padding-left:1.15em}
.cav li{margin-bottom:5px}
.cav b{color:var(--ink);font-weight:600}
footer{margin-top:46px;padding-top:16px;border-top:1px solid var(--rule);
  font-size:11.5px;color:var(--ink-3);line-height:1.65}
footer code{font-family:var(--mono);font-size:11px}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
