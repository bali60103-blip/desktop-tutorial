<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>都市高速公路 前後3D量體對比</title>
<style>
  :root{ --bg:#f4f1ea; --ink:#2b2620; --sub:#6b6255; --panel:#fffdf8e6; --line:#cabfa8; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;}
  body{font-family:"Noto Sans TC","Hiragino Sans","Helvetica Neue",system-ui,-apple-system,sans-serif;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}
  header{padding:12px 16px 8px;flex:none;}
  h1{margin:0;font-size:17px;letter-spacing:.01em;}
  h1 .en{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-top:2px;}
  .toolbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    padding:8px 16px;background:#fffdf8;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    flex:none;position:relative;z-index:20;
  }
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;}
  .seg button{border:0;background:#fff;padding:6px 13px;font-size:12px;cursor:pointer;color:var(--sub);white-space:nowrap;}
  .seg button.active{background:var(--ink);color:#fff;}
  .chk{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink);cursor:pointer;user-select:none;}
  .chk input{accent-color:var(--ink);}
  .sep{width:1px;align-self:stretch;background:var(--line);}
  #stage{position:relative;flex:1;min-height:0;background:#dfe7ec;}
  #canvasHost{position:absolute;inset:0;}
  canvas{display:block;width:100%;height:100%;}
  .corner{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;line-height:1.55;max-width:220px;}
  .hint{left:10px;bottom:10px;}
  .legend{right:10px;top:10px;}
  .legend .row{display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .swatch{width:13px;height:9px;border-radius:2px;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.25);}
  .stateCap{position:absolute;left:10px;top:10px;max-width:min(60vw,420px);}
  .stateCap .tag{font-weight:700;color:var(--ink);display:block;margin-bottom:2px;}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--sub);background:var(--bg);z-index:5;}
  .loading[hidden]{display:none;}
  footer{flex:none;padding:6px 16px 8px;font-size:10.5px;color:var(--sub);background:#fffdf8;border-top:1px solid var(--line);}
  footer a{color:#3f6f97;}
  @media (max-width:600px){
    h1{font-size:15px;}
    .toolbar{gap:6px;padding:6px 10px;}
    .seg button{padding:5px 9px;font-size:11px;}
    .corner{font-size:9.5px;padding:6px 8px;max-width:150px;}
  }
</style>
</head>
<body>
<div id="app">
<header>
  <h1>都市高速公路・前後3D量體對比<span class="en">Elevated Highway Removal — 3D Before/After Massing Viewer (schematic)</span></h1>
</header>

<div class="toolbar">
  <div class="seg" id="citySeg">
    <button type="button" data-city="nihonbashi" class="active">日本橋 Nihonbashi</button>
    <button type="button" data-city="crossbronx">Cross-Bronx</button>
    <button type="button" data-city="westside">West Side Highway</button>
  </div>
  <div class="sep"></div>
  <div class="seg" id="stateSeg">
    <button type="button" data-state="before" class="active">Before</button>
    <button type="button" data-state="after">After</button>
  </div>
  <div class="sep"></div>
  <label class="chk"><input type="checkbox" id="chkLots" checked> 街廓量體</label>
  <label class="chk"><input type="checkbox" id="chkLabels" checked> 標籤</label>
  <button type="button" class="seg" id="resetBtn" style="padding:6px 13px;font-size:12px;cursor:pointer;background:#fff;color:var(--sub);border-radius:999px;">重置視角</button>
</div>

<div id="stage">
  <div class="loading" id="loading">載入 three.js 中…</div>
  <div id="canvasHost"></div>
  <div class="corner stateCap" id="stateCap"></div>
  <div class="corner legend" id="legend"></div>
  <div class="corner hint">滑鼠拖曳＝旋轉／滾輪＝縮放／右鍵拖曳＝平移。建物高度為示意量體,非測量成果。</div>
</div>

<footer id="srcFooter"></footer>
</div>

<script src="./bundle.min.js"></script>
</body>
</html>
